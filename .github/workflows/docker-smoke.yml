name: Docker Image Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-smoke:
    runs-on: ubuntu-latest

    steps:
      # A source build needs a dumbodb/ directory in the build context.
      - uses: actions/checkout@v6
        with:
          path: dumbodb

      - uses: docker/setup-buildx-action@v4

      # Each run starts with an empty image store, so layers are cached in the
      # Actions cache. mode=max also caches the build-from-source stage, which
      # is not part of the final image. load puts the image in the runner's
      # Docker daemon for the smoke test.
      - name: Build image from source
        uses: docker/build-push-action@v7
        with:
          context: .
          file: dumbodb/docker/Dockerfile
          build-args: |
            DUMBODB_VERSION=source
          tags: dumbodb:smoke
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run smoke test
        run: dumbodb/docker/smoke-test.sh dumbodb:smoke
